<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts come with the app (src/fonts.css): no stylesheet from another origin holds the first paint. -->
    <title>Zimos — Merchant Dashboard</title>
    <!-- Set the look before first paint — no flash of the wrong one. The same keys and the same writes as src/lib/appearance.ts. -->
    <script>
      (function () {
        try {
          var e = document.documentElement;
          var get = function (key) {
            try {
              return localStorage.getItem(key);
            } catch (_) {
              return null;
            }
          };
          var share = /^\d{1,3}$/;
          // The look: Light, Black or Dark. Before there were three, the choice was "theme" = light | dark.
          var s = get("zimos.look");
          if (s !== "light" && s !== "black" && s !== "dark") {
            s = get("theme");
            if (s !== "light" && s !== "dark") s = null;
          }
          // Nothing chosen: follow the device, into the dark look that was chosen last.
          if (!s)
            s = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? get("zimos.darkLook") === "black"
                ? "black"
                : "dark"
              : "light";
          var d = s !== "light";
          e.classList.toggle("dark", d);
          e.style.colorScheme = d ? "dark" : "light";
          e.setAttribute("data-look", s);
          // Dark only: its tone, 0 (midnight) to 100 (slate), as the two shares theme/looks.css mixes with. 50 is the look as it always was.
          var t = get("zimos.darkTone");
          if (s === "dark" && t && share.test(t) && +t <= 100 && +t !== 50) {
            e.setAttribute("data-tone", String(+t));
            e.style.setProperty("--zimos-tone-mid", Math.min(100, +t * 2) + "%");
            e.style.setProperty("--zimos-tone-slate", Math.max(0, (+t - 50) * 2) + "%");
          }
          // Glass surfaces: off in the Black look, when the merchant turned them off, or when the device asks for solid ones.
          if (
            s === "black" ||
            get("zimos.glass") === "off" ||
            window.matchMedia("(prefers-reduced-transparency: reduce)").matches ||
            window.matchMedia("(forced-colors: active)").matches
          )
            e.setAttribute("data-glass", "off");
          // The glow colours of the glass backdrop, once they were changed.
          var hex = /^#[0-9a-f]{6}$/i;
          var l = get("zimos.glowLeft");
          var r = get("zimos.glowRight");
          var i = get("zimos.glowIntensity");
          if (l && hex.test(l)) e.style.setProperty("--zimos-glow-left", l.toLowerCase());
          if (r && hex.test(r)) e.style.setProperty("--zimos-glow-right", r.toLowerCase());
          if (i && share.test(i) && +i < 100) e.style.setProperty("--zimos-glow-strength", +i + "%");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
